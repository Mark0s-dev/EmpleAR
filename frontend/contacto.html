  <link rel="stylesheet" href="css/components.css">
</head>
<body>

  <!-- ===================== HEADER / NAVBAR ===================== -->
  <header class="site-header">
    <nav class="navbar" aria-label="Navegación principal">
      <a href="index.html" class="logo">EmpleAR</a>

      <button class="nav-toggle" id="navToggle" aria-expanded="false" aria-controls="navMenu" aria-label="Abrir menú">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <ul class="nav-menu" id="navMenu">
        <li><a href="index.html#buscar">Buscar empleo</a></li>

  <main>
    <p class="back-link"><a href="index.html">← Volver a EmpleAR</a></p>

    <!-- ===================== PUBLICIDAD / CONTACTO ===================== -->
    <section class="contact-section" aria-labelledby="contacto-titulo">
      <h2 id="contacto-titulo">Publicidad / Contacto</h2>
      <p>¿Querés publicitar tu marca, sponsorear una sección o proponer una colaboración? Escribinos.</p>

      <form class="contact-form" id="contactForm">
        <div class="form-group">
          <label for="contactNombre">Nombre</label>
          <input type="text" id="contactNombre" name="nombre" required>
        </div>

        <div class="form-group">
          <label for="contactEmail">Email</label>
          <input type="email" id="contactEmail" name="email" required>
        </div>

        <div class="form-group">
          <label for="motivo">Motivo</label>
          <select id="motivo" name="motivo" required>
            <option value="">Seleccionar...</option>
            <option value="publicidad">Publicidad</option>
            <option value="banners">Banners</option>
            <option value="destacadas">Ofertas destacadas</option>
            <option value="promociones">Promociones</option>
            <option value="colaboracion">Colaboraciones</option>
            <option value="precios">Precios</option>
            <option value="otro">Otra consulta comercial</option>
          </select>
        </div>

        <div class="form-group form-group-full">
          <label for="mensaje">Mensaje</label>
          <textarea id="mensaje" name="mensaje" rows="4" required></textarea>
        </div>

        <div class="form-group form-group-full">
          <button type="submit" class="btn btn-primary">Enviar consulta</button>
        </div>
      </form>
    </section>
  </main>

  <!-- ===================== FOOTER ===================== -->
  <footer class="site-footer">

</body>
</html>
