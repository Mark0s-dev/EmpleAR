    <!-- ===================== PUBLICAR EMPLEO ===================== -->
    <section class="publish-section" aria-labelledby="publicar-titulo">
      <h2 id="publicar-titulo">Publicar empleo</h2>
      <p>Completá el formulario para publicar una oferta laboral. Todas las publicaciones pasan por moderación antes de mostrarse.</p>

      <form class="publish-form" id="publishForm">
        <div class="form-group">
          <label for="empresa">Empresa</label>
          <input type="text" id="empresa" name="empresa" required>
        </div>

        <div class="form-group">
          <label for="contactoNombre">Nombre de contacto</label>
          <input type="text" id="contactoNombre" name="contactoNombre" required>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required>
        </div>

        <div class="form-group">
          <label for="telefono">Teléfono (opcional)</label>
          <input type="tel" id="telefono" name="telefono">
        </div>

        <div class="form-group">
          <label for="puesto">Puesto</label>
          <input type="text" id="puesto" name="puesto" required>
        </div>

        <div class="form-group form-group-full">
          <label for="descripcion">Descripción</label>
          <textarea id="descripcion" name="descripcion" rows="4" required></textarea>
        </div>

        <div class="form-group">
          <label for="publishProvincia">Provincia</label>
          <select id="publishProvincia" name="provincia" required>
            <option value="">Seleccionar...</option>
          </select>
        </div>

        <div class="form-group">
          <label for="publishCiudad">Ciudad</label>
          <select id="publishCiudad" name="ciudad" required>
            <option value="">Seleccionar...</option>
          </select>
        </div>

        <div class="form-group">
          <label for="publishCategoria">Categoría</label>
          <select id="publishCategoria" name="categoria" required>
            <option value="">Seleccionar...</option>
          </select>
        </div>

        <div class="form-group">
          <label for="publishModalidad">Modalidad</label>
          <select id="publishModalidad" name="modalidad" required>
            <option value="">Seleccionar...</option>
            <option value="presencial">Presencial</option>
            <option value="remoto">Remoto</option>
            <option value="hibrido">Híbrido</option>
          </select>
        </div>

        <div class="form-group">
          <label for="publishContrato">Tipo de contrato</label>
          <select id="publishContrato" name="contrato" required>
            <option value="">Seleccionar...</option>
            <option value="tiempo-completo">Tiempo completo</option>
            <option value="medio-tiempo">Medio tiempo</option>
            <option value="temporal">Temporal</option>
            <option value="freelance">Freelance</option>
          </select>
        </div>

        <div class="form-group">
          <label for="publishHorario">Horario</label>
          <select id="publishHorario" name="horario" required>
            <option value="">Seleccionar...</option>
            <option value="manana">Mañana</option>
            <option value="tarde">Tarde</option>
            <option value="noche">Noche</option>
            <option value="rotativo">Rotativo</option>
          </select>
        </div>

        <div class="form-group">
          <label for="vencimiento">Fecha de vencimiento</label>
          <input type="date" id="vencimiento" name="vencimiento" required>
        </div>

        <div class="form-group form-group-full">
          <button type="submit" class="btn btn-primary">Publicar oferta</button>
        </div>
      </form>
    </section>
